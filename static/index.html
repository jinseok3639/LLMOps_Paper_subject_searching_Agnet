<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Scholar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="/auth.js"></script>
<script defer src="/app.js"></script>
<!-- modules -->
</head>
<body>
<aside id="sidebar">
  <div class="brand">Solar Scholar</div>
  <button id="new-session" type="button" class="new-chat">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    새 대화
  </button>
  <div class="list-label">대화</div>
  <ul id="session-list"></ul>
  <div id="account"></div>
</aside>
<main>
  <header id="topbar"><span id="topbar-title"></span></header>
  <div id="scroll">
    <section id="messages"><p class="caption center">불러오는 중...</p></section>
  </div>
  <form id="chat-form" hidden>
    <div class="composer">
      <textarea id="chat-input" rows="1" placeholder="질문하거나 연구 조건을 알려 주세요"></textarea>
      <button id="send" class="send" type="submit" aria-label="보내기" title="보내기"></button>
    </div>
    <p class="hint">Enter로 보내고 Shift+Enter로 줄을 바꿉니다. 추천과 후보는 틀릴 수 있으니 원문을 확인하세요.</p>
  </form>
</main>
<aside id="state-panel">
  <h3>진행 상황</h3>
  <ol id="stages"></ol>
  <div id="activity"></div>
</aside>
</body>
</html>
