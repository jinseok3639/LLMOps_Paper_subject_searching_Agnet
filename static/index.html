<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구 주제 탐색</title>
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script defer src="/app.js"></script>
<!-- modules -->
</head>
<body>
<aside id="sidebar">
  <button id="new-session" type="button">+ 새 대화</button>
  <ul id="session-list"></ul>
</aside>
<main>
  <h1>연구 주제 탐색</h1>
  <section id="stage-view"></section>
  <section id="messages"></section>
  <form id="chat-form" hidden>
    <textarea id="chat-input" rows="2" placeholder="질문하거나 연구 조건을 알려 주세요 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
    <button type="submit">보내기</button>
  </form>
</main>
<aside id="state-panel">
  <h3>현재 상태</h3>
  <ol id="stages"></ol>
  <p class="caption">문제 선택 → 탐색 / 후보 생성 완료 → 다듬기</p>
  <p class="caption">중복 판정은 이번 버전에서 실행하지 않습니다.</p>
  <div id="activity"></div>
</aside>
</body>
</html>
